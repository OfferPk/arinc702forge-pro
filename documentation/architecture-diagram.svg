<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B10" />
      <stop offset="100%" stop-color="#0E1726" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121C2B" />
      <stop offset="100%" stop-color="#0D1522" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <!-- Title Banner -->
  <rect x="30" y="25" width="940" height="60" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
  <text x="50" y="62" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#E2E8F0">
    ARINC702Forge Pro (v1.0.0) — Advanced Flight Management Computer Architecture
  </text>
  <text x="690" y="61" font-family="monospace" font-size="12" fill="#00E5FF">
    ARINC 702A • RTCA DO-236C (PBN) • ICAO DOC 9613
  </text>

  <!-- Left Block: Flight Navigation Sensor Feeds -->
  <g transform="translate(30, 110)" filter="url(#shadow)">
    <rect width="260" height="490" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#00E5FF">1. Sensor &amp; Database Feeds</text>
    <line x1="20" y1="48" x2="240" y2="48" stroke="#1F2D42" stroke-width="1" />

    <rect x="15" y="65" width="230" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="88" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Air Data &amp; Inertial (ADIRU)</text>
    <text x="25" y="104" font-family="monospace" font-size="10" fill="#8E9CAE">WGS-84 Position, TAS, Mach, Alt</text>
    <text x="25" y="118" font-family="monospace" font-size="10" fill="#00E676">ANP Navigation Accuracy (NM)</text>

    <rect x="15" y="145" width="230" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="168" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Navigation Database (NDB)</text>
    <text x="25" y="184" font-family="monospace" font-size="10" fill="#8E9CAE">ARINC 424 Standard Records</text>
    <text x="25" y="198" font-family="monospace" font-size="10" fill="#00B4D8">Airways, Waypoints, SIDs, STARs</text>

    <rect x="15" y="225" width="230" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="248" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Performance Database (PDB)</text>
    <text x="25" y="264" font-family="monospace" font-size="10" fill="#8E9CAE">Engine Thrust, Fuel Flow, Drag Polars</text>
    <text x="25" y="278" font-family="monospace" font-size="10" fill="#FFB800">Takeoff V-Speeds (V1, VR, V2)</text>

    <rect x="15" y="305" width="230" height="65" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="328" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Fuel &amp; Weight Totalizers</text>
    <text x="25" y="344" font-family="monospace" font-size="10" fill="#8E9CAE">Gross Weight (kg), Fuel Flow (FF)</text>
    <text x="25" y="358" font-family="monospace" font-size="10" fill="#8E9CAE">Real-time CG% &amp; Reserves</text>

    <rect x="15" y="385" width="230" height="75" rx="4" fill="#090E17" stroke="#1B283A" />
    <text x="25" y="408" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Pilot CDU Entry (Cost Index)</text>
    <text x="25" y="424" font-family="monospace" font-size="10" fill="#8E9CAE">CI (0 to 200), Cruise FL, Reserves</text>
    <text x="25" y="438" font-family="monospace" font-size="10" fill="#00E5FF">RNP Containment Level (0.1 - 4.0 NM)</text>
  </g>

  <!-- Center Block: ARINC 702A FMS 4D Trajectory Core -->
  <g transform="translate(320, 110)" filter="url(#shadow)">
    <rect width="360" height="490" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#00E5FF">2. FMS 4D Trajectory Core</text>
    <line x1="20" y1="48" x2="340" y2="48" stroke="#1F2D42" stroke-width="1" />

    <!-- Sub-kernel A: Performance & VNAV -->
    <rect x="15" y="60" width="330" height="195" rx="6" fill="#090E17" stroke="#00B4D8" stroke-width="1" />
    <text x="25" y="85" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00B4D8">VNAV &amp; Performance Core</text>
    <text x="25" y="108" font-family="monospace" font-size="10" fill="#E2E8F0">• Cost Index Optimization: ECON Mach &amp; IAS</text>
    <text x="25" y="126" font-family="monospace" font-size="10" fill="#E2E8F0">• Takeoff Speeds: V1 &lt;= VR &lt;= V2 &lt; Vclean</text>
    <text x="25" y="144" font-family="monospace" font-size="10" fill="#E2E8F0">• Aerodynamic 1.3g Buffet Ceiling (Opt / Max FL)</text>
    <text x="25" y="162" font-family="monospace" font-size="10" fill="#E2E8F0">• Top of Climb (TOC) Distance &amp; Time Calculation</text>
    <text x="25" y="180" font-family="monospace" font-size="10" fill="#E2E8F0">• Step Climb Optimization (+2000' / +4000')</text>
    <text x="25" y="198" font-family="monospace" font-size="10" fill="#FFB800">• Top of Descent (TOD) Idle-Thrust 3.0° Gradient</text>

    <!-- Sub-kernel B: LNAV & RNP Containment -->
    <rect x="15" y="270" width="330" height="205" rx="6" fill="#090E17" stroke="#00E676" stroke-width="1" />
    <text x="25" y="295" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00E676">LNAV &amp; PBN Containment</text>
    <text x="25" y="318" font-family="monospace" font-size="10" fill="#E2E8F0">• Fly-by Turn Anticipation: d = R * tan(Δθ / 2)</text>
    <text x="25" y="336" font-family="monospace" font-size="10" fill="#E2E8F0">• Turn Radius R = V_TAS^2 / (68625 * tan(bank))</text>
    <text x="25" y="354" font-family="monospace" font-size="10" fill="#E2E8F0">• Great Circle Track &amp; Distance Accumulation</text>
    <text x="25" y="372" font-family="monospace" font-size="10" fill="#E2E8F0">• RTCA DO-236C Containment: ANP &lt;= RNP</text>
    <text x="25" y="390" font-family="monospace" font-size="10" fill="#FF2A4B">• "UNABLE RNP" Warning Annunciation (ANP &gt; RNP)</text>
    <text x="25" y="408" font-family="monospace" font-size="10" fill="#E2E8F0">• 250 KIAS Restriction below 10,000 ft MSL</text>
  </g>

  <!-- Right Block: Cockpit Displays & Flight Control -->
  <g transform="translate(710, 110)" filter="url(#shadow)">
    <rect width="260" height="490" rx="8" fill="url(#panelGrad)" stroke="#1F2D42" stroke-width="1.5" />
    <text x="20" y="35" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#00E5FF">3. Glass Cockpit &amp; FCC</text>
    <line x1="20" y1="48" x2="240" y2="48" stroke="#1F2D42" stroke-width="1" />

    <rect x="15" y="65" width="230" height="70" rx="4" fill="#090E17" stroke="#00E676" stroke-width="1.5" />
    <text x="25" y="88" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676">Navigation Display (ND)</text>
    <text x="25" y="106" font-family="monospace" font-size="10" fill="#E2E8F0">Active LNAV Route &amp; Turn Arcs</text>
    <text x="25" y="122" font-family="monospace" font-size="10" fill="#8E9CAE">RNP Containment Limits &amp; TOD Marker</text>

    <rect x="15" y="150" width="230" height="70" rx="4" fill="#090E17" stroke="#00B4D8" stroke-width="1.5" />
    <text x="25" y="173" font-family="monospace" font-size="11" font-weight="bold" fill="#00B4D8">Primary Flight Display (PFD)</text>
    <text x="25" y="191" font-family="monospace" font-size="10" fill="#E2E8F0">Flight Mode Annunciator (FMA)</text>
    <text x="25" y="207" font-family="monospace" font-size="10" fill="#8E9CAE">VNAV PTH / LNAV Armed &amp; V-Speeds</text>

    <rect x="15" y="235" width="230" height="70" rx="4" fill="#090E17" stroke="#FFB800" stroke-width="1.5" />
    <text x="25" y="258" font-family="monospace" font-size="11" font-weight="bold" fill="#FFB800">Flight Control Computer (FCC)</text>
    <text x="25" y="276" font-family="monospace" font-size="10" fill="#E2E8F0">Roll &amp; Pitch Steering Commands</text>
    <text x="25" y="292" font-family="monospace" font-size="10" fill="#8E9CAE">Autothrottle (A/T) Speed Target</text>

    <rect x="15" y="320" width="230" height="70" rx="4" fill="#090E17" stroke="#00E5FF" stroke-width="1.5" />
    <text x="25" y="343" font-family="monospace" font-size="11" font-weight="bold" fill="#00E5FF">CDU / Multifunction Display</text>
    <text x="25" y="361" font-family="monospace" font-size="10" fill="#E2E8F0">PERF INIT &amp; VNAV PROFILE Pages</text>
    <text x="25" y="377" font-family="monospace" font-size="10" fill="#8E9CAE">Fuel Prediction &amp; Progress ETA</text>

    <rect x="15" y="405" width="230" height="65" rx="4" fill="#090E17" stroke="#E2E8F0" stroke-width="1" />
    <text x="25" y="428" font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0">Autopilot / Flight Director</text>
    <text x="25" y="446" font-family="monospace" font-size="10" fill="#8E9CAE">Fly-by Waypoint Sequence Trigger</text>
    <text x="25" y="460" font-family="monospace" font-size="10" fill="#8E9CAE">Altitude Capture &amp; Glidepath Hold</text>
  </g>

  <!-- Connective Arrows -->
  <line x1="290" y1="230" x2="320" y2="230" stroke="#00B4D8" stroke-width="2" />
  <polygon points="318,226 326,230 318,234" fill="#00B4D8" />

  <line x1="290" y1="410" x2="320" y2="410" stroke="#FFB800" stroke-width="2" />
  <polygon points="318,406 326,410 318,414" fill="#FFB800" />

  <line x1="680" y1="210" x2="710" y2="210" stroke="#00E676" stroke-width="2" />
  <polygon points="708,206 716,210 708,214" fill="#00E676" />

  <line x1="680" y1="370" x2="710" y2="370" stroke="#00E5FF" stroke-width="2" />
  <polygon points="708,366 716,370 708,374" fill="#00E5FF" />
</svg>