    <!-- Sliders -->
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Gross Weight: <tspan fill="#00B4D8" font-family="monospace" font-weight="bold">220,000 kg</tspan></text>
    <rect x="20" y="73" width="320" height="4" rx="2" fill="#1E2A3A" />
    <rect x="20" y="73" width="180" height="4" rx="2" fill="#00B4D8" />
    <circle cx="200" cy="75" r="7" fill="#FFF" />

    <text x="20" y="110" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Cost Index (CI): <tspan fill="#00B4D8" font-family="monospace" font-weight="bold">50</tspan></text>
    <rect x="20" y="118" width="320" height="4" rx="2" fill="#1E2A3A" />
    <rect x="20" y="118" width="80" height="4" rx="2" fill="#00B4D8" />
    <circle cx="100" cy="120" r="7" fill="#FFF" />

    <text x="20" y="155" font-family="-apple-system, sans-serif" font-size="11" fill="#8E9CAE">Cruise Altitude: <tspan fill="#00B4D8" font-family="monospace" font-weight="bold">FL370 (37,000 ft)</tspan></text>
    <rect x="20" y="163" width="320" height="4" rx="2" fill="#1E2A3A" />
    <rect x="20" y="163" width="220" height="4" rx="2" fill="#00B4D8" />
    <circle cx="240" cy="165" r="7" fill="#FFF" />

    <!-- CDU Box Summary -->
    <rect x="20" y="195" width="320" height="335" rx="6" fill="#020703" stroke="#1E4D2B" stroke-width="2" />
    <text x="180" y="222" font-family="monospace" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">=== FMS PERF &amp; TAKEOFF REF ===</text>

    <text x="35" y="255" font-family="monospace" font-size="10" fill="#FFB000">TAKEOFF V1:</text>
    <text x="130" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">157 KT</text>
    <text x="195" y="255" font-family="monospace" font-size="10" fill="#FFB000">ROTATION VR:</text>
    <text x="290" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">163 KT</text>

    <text x="35" y="285" font-family="monospace" font-size="10" fill="#FFB000">SAFETY V2:</text>
    <text x="130" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">173 KT</text>
    <text x="195" y="285" font-family="monospace" font-size="10" fill="#FFB000">V_CLEAN:</text>
    <text x="290" y="285" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">223 KT</text>

    <text x="35" y="325" font-family="monospace" font-size="10" fill="#FFB000">ECON CRZ:</text>
    <text x="130" y="325" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">M0.810</text>
    <text x="195" y="325" font-family="monospace" font-size="10" fill="#FFB000">CLB / DES:</text>
    <text x="275" y="325" font-family="monospace" font-size="11" font-weight="bold" fill="#39FF14">304 / 275K</text>

    <text x="35" y="365" font-family="monospace" font-size="10" fill="#FFB000">OPT / MAX:</text>
    <text x="130" y="365" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">FL340 / FL360</text>
    <text x="195" y="365" font-family="monospace" font-size="10" fill="#FFB000">DESCENT TOD:</text>
    <text x="290" y="365" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">128 NM</text>

    <text x="35" y="405" font-family="monospace" font-size="10" fill="#FFB000">RNP LEVEL:</text>
    <text x="130" y="405" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">0.30 NM</text>
    <text x="195" y="405" font-family="monospace" font-size="10" fill="#FFB000">ANP ACTUAL:</text>
    <text x="290" y="405" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">0.080 NM</text>

    <text x="35" y="445" font-family="monospace" font-size="10" fill="#FFB000">DECEL 10K:</text>
    <text x="130" y="445" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">250 KIAS</text>
    <text x="195" y="445" font-family="monospace" font-size="10" fill="#FFB000">FLY-BY LEAD:</text>
    <text x="290" y="445" font-family="monospace" font-size="12" font-weight="bold" fill="#39FF14">3.8 NM</text>
  </g>

  <!-- Right Visual Panels -->
  <!-- VNAV Profile Display -->
  <g transform="translate(400, 220)">
    <rect width="780" height="230" rx="8" fill="#05080E" stroke="#1F2D42" />
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00E5FF">VNAV Vertical Flight Profile (ARINC 702A Display)</text>
    <text x="500" y="28" font-family="monospace" font-size="11" fill="#00E676">IDLE-THRUST 3.0° GRADIENT</text>

    <!-- Axes -->
    <line x1="40" y1="200" x2="740" y2="200" stroke="#1F2D42" stroke-width="1.5" />
    <line x1="40" y1="40" x2="40" y2="200" stroke="#1F2D42" stroke-width="1.5" />

    <text x="35" y="200" font-family="monospace" font-size="9" fill="#8E9CAE" text-anchor="end">0'</text>
    <text x="35" y="140" font-family="monospace" font-size="9" fill="#8E9CAE" text-anchor="end">10k'</text>
    <text x="35" y="70" font-family="monospace" font-size="9" fill="#8E9CAE" text-anchor="end">FL370</text>

    <!-- Climb to TOC -->
