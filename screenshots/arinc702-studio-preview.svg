    <polygon points="40,50 740,50 740,110 40,110" fill="rgba(0,229,255,0.05)" stroke="#00E5FF" stroke-dasharray="3,3" stroke-width="1" />
    <text x="745" y="55" font-family="monospace" font-size="8" fill="#00E5FF">+0.30 NM</text>
    <text x="745" y="115" font-family="monospace" font-size="8" fill="#00E5FF">-0.30 NM</text>

    <!-- Centerline -->
    <line x1="40" y1="80" x2="740" y2="80" stroke="#00B4D8" stroke-width="2" />

    <!-- Waypoints with Fly-by -->
    <circle cx="120" cy="80" r="4" fill="#00E5FF" />
    <text x="120" y="70" font-family="monospace" font-size="10" fill="#00E5FF" text-anchor="middle">GOMUP</text>

    <circle cx="340" cy="80" r="4" fill="#00E5FF" />
    <text x="340" y="70" font-family="monospace" font-size="10" fill="#00E5FF" text-anchor="middle">NIBOG</text>

    <!-- Fly-by Turn Arc -->
    <path d="M 300,80 Q 340,80 370,105" fill="none" stroke="#FFB800" stroke-width="3" />
    <text x="345" y="115" font-family="monospace" font-size="9" fill="#FFB800">FLY-BY LEAD 3.8 NM</text>

    <circle cx="580" cy="80" r="4" fill="#00E5FF" />
    <text x="580" y="70" font-family="monospace" font-size="10" fill="#00E5FF" text-anchor="middle">LIMRI</text>

    <!-- Aircraft Symbol -->
    <circle cx="210" cy="80" r="5" fill="#00E676" />
    <text x="220" y="84" font-family="monospace" font-size="10" font-weight="bold" fill="#00E676">ACFT (ANP 0.080 NM)</text>
  </g>

  <!-- 10-Point Normative Auditor Table -->
  <g transform="translate(400, 630)">
    <rect width="780" height="145" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" />
    <text x="20" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#00E5FF">10-Point Normative ARINC 702A / DO-236C Compliance Audit</text>
    <rect x="540" y="8" width="220" height="22" rx="4" fill="rgba(0,230,118,0.15)" stroke="#00E676" />
    <text x="650" y="23" font-family="monospace" font-size="10" font-weight="bold" fill="#00E676" text-anchor="middle">SCORE: 10/10 (100.0% CERTIFIED)</text>

    <g transform="translate(20, 36)" font-family="monospace" font-size="9">
      <text y="14" fill="#00E5FF" font-weight="bold">RULE_01</text>
      <text x="70" y="14" fill="#E2E8F0">ARINC 702A Section 3.2: Cost Index (CI 0-200) Speed Optimization (ECON Mach)</text>
      <text x="660" y="14" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="28" fill="#00E5FF" font-weight="bold">RULE_02</text>
      <text x="70" y="28" fill="#E2E8F0">ARINC 702A Section 4.1: Takeoff Speeds Sequence (V1 &lt;= VR &lt;= V2 &lt; Vclean)</text>
      <text x="660" y="28" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="42" fill="#00E5FF" font-weight="bold">RULE_03</text>
      <text x="70" y="42" fill="#E2E8F0">ARINC 702A Section 4.3: 1.3g Buffet Margin &amp; Optimum Altitude Scaling</text>
      <text x="660" y="42" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="56" fill="#00E5FF" font-weight="bold">RULE_04</text>
      <text x="70" y="56" fill="#E2E8F0">ARINC 702A Section 4.5: Top of Descent (TOD) Idle-Thrust 3.0° Gradient Path</text>
      <text x="660" y="56" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="70" fill="#00E5FF" font-weight="bold">RULE_06</text>
      <text x="70" y="70" fill="#E2E8F0">ARINC 702A Section 5.1 &amp; DO-236C: Fly-by Turn Lead Distance (d = R * tan)</text>
      <text x="660" y="70" fill="#00E676" font-weight="bold">● PASSED</text>

      <text y="84" fill="#00E5FF" font-weight="bold">RULE_08</text>
      <text x="70" y="84" fill="#E2E8F0">RTCA DO-236C Section 3.4: &#39;UNABLE RNP&#39; Containment Alerting (ANP &gt; RNP)</text>
      <text x="660" y="84" fill="#00E676" font-weight="bold">● PASSED</text>
    </g>
  </g>
</svg>