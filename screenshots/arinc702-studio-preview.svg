<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B10" />
      <stop offset="100%" stop-color="#0A1017" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1724" />
      <stop offset="100%" stop-color="#090E16" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#studioBg)" />

  <!-- Top App Bar -->
  <rect x="20" y="20" width="1160" height="65" rx="8" fill="url(#cardGrad)" stroke="#1F2D42" stroke-width="1.5" />
  <text x="45" y="58" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" fill="#E2E8F0">
    🧭 ARINC702Forge <tspan fill="#00E5FF">Pro</tspan> <tspan font-size="14" fill="#8E9CAE" font-weight="normal">(v1.0.0)</tspan>
  </text>
  <rect x="690" y="38" width="300" height="28" rx="4" fill="rgba(0,230,118,0.12)" stroke="#00E676" stroke-width="1" />
  <text x="702" y="56" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676">● ARINC 702A &amp; DO-236C CERTIFIED</text>
  <text x="1030" y="56" font-family="monospace" font-size="11" fill="#00E5FF">LNAV/VNAV • UTC 05:45:00Z</text>

  <!-- Presets Bar -->
  <rect x="20" y="98" width="1160" height="48" rx="6" fill="#0C131D" stroke="#1F2D42" />
  <text x="35" y="128" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#8E9CAE">PRESETS:</text>

  <rect x="110" y="108" width="220" height="28" rx="4" fill="rgba(0,229,255,0.15)" stroke="#00E5FF" />
  <text x="122" y="126" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#00E5FF">✈️ Transcon Cruise (CI 50 / M0.81)</text>

  <rect x="340" y="108" width="210" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="352" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">🛫 Heavy Takeoff Performance</text>

  <rect x="560" y="108" width="210" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="572" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">⚡ High Cost Index Rush (CI 150)</text>

  <rect x="780" y="108" width="200" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="792" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#E2E8F0">📉 VNAV Top of Descent (TOD)</text>

  <rect x="990" y="108" width="180" height="28" rx="4" fill="#121C2B" stroke="#1F2D42" />
  <text x="1002" y="126" font-family="-apple-system, sans-serif" font-size="11" fill="#FF2A4B">🚨 UNABLE RNP Alert</text>

  <!-- Annunciators Row -->
  <g transform="translate(20, 160)">
    <rect x="0" y="0" width="180" height="44" rx="4" fill="rgba(0,230,118,0.15)" stroke="#00E676" stroke-width="2" />
    <text x="90" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676" text-anchor="middle">LNAV ENGAGED</text>

    <rect x="195" y="0" width="180" height="44" rx="4" fill="rgba(0,230,118,0.15)" stroke="#00E676" stroke-width="2" />
    <text x="285" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676" text-anchor="middle">VNAV PTH ENGAGED</text>

    <rect x="390" y="0" width="185" height="44" rx="4" fill="rgba(0,230,118,0.15)" stroke="#00E676" stroke-width="2" />
    <text x="482" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676" text-anchor="middle">RNP CONTAINED</text>

    <rect x="590" y="0" width="185" height="44" rx="4" fill="#090E17" stroke="#1E2D42" stroke-width="2" />
    <text x="682" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#37475F" text-anchor="middle">STEP CLIMB AVAIL</text>

    <rect x="790" y="0" width="185" height="44" rx="4" fill="rgba(0,230,118,0.15)" stroke="#00E676" stroke-width="2" />
    <text x="882" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#00E676" text-anchor="middle">DECEL 250K &lt; 10,000'</text>

    <rect x="990" y="0" width="170" height="44" rx="4" fill="#090E17" stroke="#1E2D42" stroke-width="2" />
    <text x="1075" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#37475F" text-anchor="middle">UNABLE RNP</text>
  </g>

  <!-- Left Column: Controls (Width 360) -->
  <g transform="translate(20, 220)">
