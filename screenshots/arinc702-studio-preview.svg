    <circle cx="160" cy="70" r="5" fill="#00E5FF" />
    <text x="160" y="55" font-family="monospace" font-size="10" font-weight="bold" fill="#00E5FF" text-anchor="middle">TOC (45 NM)</text>

    <!-- Cruise to TOD -->
    <line x1="160" y1="70" x2="520" y2="70" stroke="#00E5FF" stroke-width="3" />
    <circle cx="520" cy="70" r="6" fill="#FFB800" />
    <text x="520" y="55" font-family="monospace" font-size="11" font-weight="bold" fill="#FFB800" text-anchor="middle">TOD (128 NM)</text>

    <!-- 3.0 deg Descent -->
    <line x1="520" y1="70" x2="660" y2="140" stroke="#00E676" stroke-width="3" stroke-dasharray="5,2" />
    <text x="600" y="95" font-family="monospace" font-size="10" fill="#00E676">3.0° PATH (318'/NM)</text>

    <!-- 250K Decel segment -->
    <line x1="660" y1="140" x2="700" y2="140" stroke="#FF2A85" stroke-width="3.5" />
    <text x="680" y="130" font-family="monospace" font-size="9" font-weight="bold" fill="#FF2A85" text-anchor="middle">DECEL 250K</text>

    <!-- Final approach to touchdown -->
    <line x1="700" y1="140" x2="740" y2="200" stroke="#00E676" stroke-width="2.5" />
    <rect x="735" y="194" width="20" height="8" fill="#FFF" />
  </g>

  <!-- LNAV Navigation Display -->
  <g transform="translate(400, 465)">
    <rect width="780" height="150" rx="8" fill="#05080E" stroke="#1F2D42" />
